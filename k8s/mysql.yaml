apiVersion: v1
kind: Service
metadata:
  name: mysql-usuarios
  namespace: motopartes
spec:
  clusterIP: None
  selector:
    app: mysql-usuarios
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-usuarios
  namespace: motopartes
spec:
  serviceName: mysql-usuarios
  replicas: 1
  selector:
    matchLabels:
      app: mysql-usuarios
  template:
    metadata:
      labels:
        app: mysql-usuarios
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: motopartes-secret
                  key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: usuarios_db
        - name: MYSQL_USER
          value: usuarios_app
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: datos-mysql
              key: USUARIOS_DB_PASSWORD
          volumeMounts:
            - name: datos-mysql
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  MYSQL_PWD="$MYSQL_PASSWORD" mysql --protocol=TCP
                  -h 127.0.0.1 -u "$MYSQL_USER" -D "$MYSQL_DATABASE"
                  -e "SELECT 1"
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
  volumeClaimTemplates:
    - metadata:
        name: datos-mysql
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
