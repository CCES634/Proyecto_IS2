# Microservicio de Usuarios y Autenticación (emite los JWT)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usuarios
  namespace: motopartes
  labels:
    app: usuarios
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usuarios
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: usuarios
    spec:
      containers:
        - name: usuarios
          image: motopartes/usuarios:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: motopartes-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: motopartes-secret
                  key: USUARIOS_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: motopartes-secret
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: motopartes-secret
                  key: ADMIN_PASSWORD
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: usuarios
  namespace: motopartes
spec:
  type: ClusterIP   # solo accesible dentro del clúster
  selector:
    app: usuarios
  ports:
    - port: 5000
      targetPort: 5000
