# Credenciales y claves sensibles. En un entorno real NO se versionan en Git:
# se crean con `kubectl create secret` o un gestor de secretos. Aquí se dejan
# con valores de desarrollo para que el proyecto se pueda desplegar en clase.
apiVersion: v1
kind: Secret
metadata:
  name: motopartes-secret
  namespace: motopartes
type: Opaque
stringData:
  JWT_SECRET: "jwt-motopartes-andina-2026-cambiar"
  MYSQL_ROOT_PASSWORD: "RootPass2026"
  ADMIN_PASSWORD: "Admin12345"
  USUARIOS_DATABASE_URL: "mysql+pymysql://usuarios_app:UsuariosPass2026@mysql:3306/usuarios_db"
  CATALOGO_DATABASE_URL: "mysql+pymysql://catalogo_app:CatalogoPass2026@mysql:3306/catalogo_db"
  INVENTARIO_DATABASE_URL: "mysql+pymysql://inventario_app:InventarioPass2026@mysql:3306/inventario_db"
  COMPRAS_DATABASE_URL: "mysql+pymysql://compras_app:ComprasPass2026@mysql:3306/compras_db"
---
# Script de inicialización de MySQL: una base de datos y un usuario por microservicio
apiVersion: v1
kind: Secret
metadata:
  name: mysql-init
  namespace: motopartes
type: Opaque
stringData:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS usuarios_db   CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS catalogo_db   CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS inventario_db CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE DATABASE IF NOT EXISTS compras_db    CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
    CREATE USER IF NOT EXISTS 'usuarios_app'@'%'   IDENTIFIED BY 'UsuariosPass2026';
    CREATE USER IF NOT EXISTS 'catalogo_app'@'%'   IDENTIFIED BY 'CatalogoPass2026';
    CREATE USER IF NOT EXISTS 'inventario_app'@'%' IDENTIFIED BY 'InventarioPass2026';
    CREATE USER IF NOT EXISTS 'compras_app'@'%'    IDENTIFIED BY 'ComprasPass2026';
    GRANT ALL PRIVILEGES ON usuarios_db.*   TO 'usuarios_app'@'%';
    GRANT ALL PRIVILEGES ON catalogo_db.*   TO 'catalogo_app'@'%';
    GRANT ALL PRIVILEGES ON inventario_db.* TO 'inventario_app'@'%';
    GRANT ALL PRIVILEGES ON compras_db.*    TO 'compras_app'@'%';
    FLUSH PRIVILEGES;
