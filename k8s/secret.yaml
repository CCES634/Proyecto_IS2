# Credenciales y claves sensibles. En un entorno real NO se versionan en Git:
# se crean con `kubectl create secret` o un gestor de secretos. Aquí se dejan
# con valores de desarrollo para que el proyecto se pueda desplegar en clase.
apiVersion: v1
kind: Secret
metadata:
  name: motopartes-secret
  namespace: motopartes
type: Opaque
stringData:
  JWT_SECRET: "jwt-motopartes-andina-2026-cambiar"
  MYSQL_ROOT_PASSWORD: "RootPass2026"
  ADMIN_PASSWORD: "Admin12345"
  USUARIOS_DB_PASSWORD: "UsuariosPass2026"
  CATALOGO_DB_PASSWORD: "CatalogoPass2026"
  INVENTARIO_DB_PASSWORD: "InventarioPass2026"
  COMPRAS_DB_PASSWORD: "ComprasPass2026"
  USUARIOS_DATABASE_URL: "mysql+pymysql://usuarios_app:UsuariosPass2026@mysql-usuarios:3306/usuarios_db"
  CATALOGO_DATABASE_URL: "mysql+pymysql://catalogo_app:CatalogoPass2026@mysql-catalogo:3306/catalogo_db"
  INVENTARIO_DATABASE_URL: "mysql+pymysql://inventario_app:InventarioPass2026@mysql-inventario:3306/inventario_db"
  COMPRAS_DATABASE_URL: "mysql+pymysql://compras_app:ComprasPass2026@mysql-compras:3306/compras_db"
